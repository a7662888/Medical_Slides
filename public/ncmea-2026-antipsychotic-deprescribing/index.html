<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NCMEA 2026｜v6 簡報內容與逐字稿</title>
  <style>
    :root{--navy:#1f3864;--teal:#2a9d8f;--orange:#f28c28;--ink:#24313a;--muted:#60717d;--paper:#fff;--wash:#eef3f6;--line:#d7e0e5;}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--wash);color:var(--ink);font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;line-height:1.65}
    button,input{font:inherit}
    .topbar{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,var(--navy),#274e7e);color:white;padding:14px 22px;box-shadow:0 3px 14px #1f386433;display:flex;align-items:center;gap:16px}
    .brand{font-weight:800;letter-spacing:.02em;white-space:nowrap}
    .progress{height:4px;position:fixed;left:0;top:0;background:var(--teal);z-index:30;transition:width .2s}
    .search{margin-left:auto;min-width:260px;border:0;border-radius:24px;padding:8px 14px;background:#ffffff18;color:white;outline:1px solid #ffffff33}
    .search::placeholder{color:#e6eef4}
    .layout{display:grid;grid-template-columns:280px minmax(0,1fr);max-width:1600px;margin:auto;min-height:calc(100vh - 64px)}
    aside{position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto;padding:18px;background:#f8fafb;border-right:1px solid var(--line)}
    .meta{font-size:.82rem;color:var(--muted);padding:0 8px 12px}
    .navbtn{display:block;width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;margin:2px 0;border-radius:8px;color:#33434d;cursor:pointer}
    .navbtn:hover{background:#e8f2f1}
    .navbtn.active{background:var(--teal);color:white;font-weight:700}
    .navbtn small{opacity:.75;margin-right:6px}
    main{padding:28px clamp(18px,4vw,58px) 60px;min-width:0}
    .hero{background:var(--paper);border-radius:18px;padding:22px 26px;margin-bottom:24px;border-top:7px solid var(--teal);box-shadow:0 8px 28px #24313a12}
    .hero h1{margin:0;color:var(--navy);font-size:clamp(1.55rem,3vw,2.35rem);line-height:1.3}
    .hero p{margin:.45rem 0 0;color:var(--muted)}
    .slide-card{scroll-margin-top:80px;background:white;border-radius:18px;margin:0 0 28px;box-shadow:0 8px 28px #24313a12;overflow:hidden;border:1px solid #dfe7eb}
    .slide-head{display:flex;align-items:flex-start;gap:16px;padding:20px 24px 14px;border-bottom:1px solid var(--line)}
    .num{flex:0 0 auto;border-radius:50%;width:42px;height:42px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800}
    .slide-head h2{margin:0;color:var(--navy);font-size:1.35rem;line-height:1.35}
    .section{color:var(--teal);font-size:.83rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
    .slide-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(320px,.8fr);gap:22px;padding:22px}
    .shot{width:100%;height:auto;display:block;border:1px solid #cfd9df;box-shadow:0 5px 18px #26323818}
    .panel{border-left:4px solid var(--teal);background:#f7fafb;border-radius:0 12px 12px 0;padding:16px 18px;margin-bottom:16px}
    .panel.script{border-left-color:var(--orange);background:#fff9f0}
    .panel h3{margin:0 0 8px;color:var(--navy);font-size:1rem}
    .panel ul{margin:0;padding-left:1.2rem}
    .panel p{margin:0;white-space:pre-line}
    details{border-top:1px solid var(--line);padding:12px 22px 18px;color:#465862}
    summary{cursor:pointer;color:var(--navy);font-weight:700}
    details pre{white-space:pre-wrap;font-family:inherit;font-size:.9rem;background:#f4f6f8;padding:14px;border-radius:10px}
    .actions{display:flex;gap:10px;margin-top:12px}
    .copy{border:1px solid var(--teal);background:white;color:var(--teal);padding:6px 12px;border-radius:18px;cursor:pointer}
    .copy:hover{background:var(--teal);color:white}
    .empty{display:none;background:white;padding:30px;border-radius:14px;text-align:center;color:var(--muted)}
    .footer{text-align:center;color:var(--muted);font-size:.82rem;margin-top:22px}
    @media(max-width:1050px){.layout{grid-template-columns:1fr} aside{display:none} .slide-grid{grid-template-columns:1fr} .search{min-width:0;width:42vw}}
    @media(max-width:620px){.topbar{padding:10px;gap:8px} .brand{font-size:.82rem;line-height:1.2;white-space:normal;flex:0 1 44%} .search{width:auto;min-width:0;flex:1;font-size:.82rem} main{padding:16px 10px 40px} .hero,.slide-head{padding:16px} .slide-grid{padding:14px}}
    @media print{.topbar,aside,.actions,.hero p,.footer{display:none!important} body{background:white} .layout{display:block} main{padding:0} .hero{box-shadow:none;border-radius:0;margin:0 0 12px} .slide-card{break-after:page;box-shadow:none;border:0;border-radius:0;margin:0} .slide-grid{grid-template-columns:1fr 1fr;padding:12px} details{display:none}}
  </style>
